name: Deploy To Servers

on:
  push:
    branches: [ "main" ]

jobs:
  # 103번 서버(API-Node1) 전용 명령
  deploy-103:
    runs-on: [self-hosted, API-Node1]
    steps:
      - name: 코드 땡겨오기
        uses: actions/checkout@v3
      - name: 배포 및 재시작
        run: |
          sudo cp -r frontend/* /var/www/html/
          npm install
          pm2 reload all

  # 104번 서버(API-Node2) 전용 명령
  deploy-104:
    runs-on: [self-hosted, API-Node2]
    steps:
      - name: 코드 땡겨오기
        uses: actions/checkout@v3
      - name: 배포 및 재시작
        run: |
          sudo cp -r frontend/* /var/www/html/
          npm install
          pm2 reload all
