<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니게임 천국</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a2e; color: #fff; font-family: 'Arial', sans-serif; text-align: center; }
        header { background: #16213e; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 40px; }
        h1 { margin: 0; color: #e94560; font-size: 36px; text-shadow: 2px 2px 4px #000; }
        p { color: #0f3460; font-size: 18px; color: #a2a2bb; margin-top: 10px; }
        
        /* 6개의 게임을 배치할 그리드 */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* 개별 게임 카드 디자인 */
        .game-card { background: #0f3460; border-radius: 15px; overflow: hidden; text-decoration: none; color: white; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(233, 69, 96, 0.5); }
        
        /* 게임 썸네일 (정사각형) */
        .game-thumb { width: 100%; aspect-ratio: 1/1; background-color: #ded895; display: flex; justify-content: center; align-items: center; font-size: 80px; }
        .game-thumb.flappy { background: #71c5cf; }
        .game-thumb.clicker { background: #ff4757; }
        .game-thumb.coming { background: #333; color: #666; }

        /* 게임 제목 영역 */
        .game-info { padding: 20px; }
        .game-info h2 { margin: 0 0 10px 0; font-size: 22px; color: #fff; }
        .game-info span { font-size: 14px; color: #e94560; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🎮미니게임 천국</h1>
        <p>어떤 게임에 도전하시겠습니까?</p>
    </header>

    <div class="game-grid">
        <a href="/flappy.html" class="game-card">
            <div class="game-thumb flappy">🐥</div>
            <div class="game-info">
                <h2>플래피 버드</h2>
            </div>
        </a>

        
	<a href="/clicker.html" class="game-card">
            <div class="game-thumb" style="background: #2c3e50;">🔫</div>
            <div class="game-info">
                <h2>마린 키우기</h2>
            </div>
        </a>

        <a href="/shooter.html" class="game-card">
            <div class="game-thumb" style="background: #1f2833;">🚀</div>
            <div class="game-info">
                <h2>운석 부수기</h2>
            </div>
        </a>

        <a href="/minesweeper.html" class="game-card">
            <div class="game-thumb" style="background: #2b2b2b;">💣</div>
            <div class="game-info">
                <h2>지뢰찾기</h2>
            </div>
        </a>

	<a href="/choseong.html" class="game-card">
            <div class="game-thumb" style="background: #e67e22;">🧠</div>
            <div class="game-info">
                <h2>30초 두뇌 풀가동 (초성)</h2>
            </div>
        </a>
	
        <a href="/runner.html" class="game-card">
            <div class="game-thumb" style="background: #27ae60;">🐒</div>
            <div class="game-info">
                <h2>원숭이 무한 점프</h2>
            </div>
        </a>

    </div>
</body>
</html>
